<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient
            id="cctGradient"
            x1="0"
            y1="0"
            x2="0"
            y2="1"
        >
            <stop
                offset="0%"
                stopColor="#1E90FF"
            />
            <stop
                offset="100%"
                stopColor="#FF8C00"
            />
        </linearGradient>

        <!-- Optional drop-shadow filter for depth. -->
        <filter
            id="insetShadow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
        >
            <feOffset
                dx="0"
                dy="2"
            />
            <feGaussianBlur
                stdDeviation="4"
                result="offset-blur"
            />
            <feComposite
                operator="out"
                in="SourceGraphic"
                in2="offset-blur"
                result="inverse"
            />
            <feFlood
                floodColor="#FFF176"
                floodOpacity="0.4"
            />
            <feComposite
                in2="inverse"
                operator="in"
                result="shadow"
            />
            <feComposite
                in="shadow"
                in2="SourceGraphic"
                operator="over"
            />
        </filter>
    </defs>

    <!-- Thick outer ring. -->
    <circle
        cx="256"
        cy="256"
        r="252"
        fill="#FFF176"
    />

    <!-- Inner circle with gradient + shadow effect. -->
    <circle
        cx="256"
        cy="256"
        r="240"
        fill="url(#cctGradient)"
        filter="url(#insetShadow)"
    />

    <!-- Enlarged lamp symbol. -->
    <g transform="translate(256 280) scale(1.2) translate(-256 -256)">
        <path
            d="M192 200c0-35 29-64 64-64s64 29 64 64c0 23.1-12.2 43.5-30.6 55.3V288c0 8.8-7.2 16-16 16h-35c-8.8 0-16-7.2-16-16v-32.7C204.2 243.5 192 223.1 192 200zm56 136h16c4.4 0 8 3.6 8 8v16h-32v-16c0-4.4 3.6-8 8-8z"
            fill="#FFF176"
            stroke="#000000"
            stroke-width="4"
        />
    </g>
</svg>
