# This is a composition of lint and test scripts
# Make sure to update this file along with the others

name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - 'main'
        tags:
            # normal versions
            - 'v?[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v?[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Performs quick checks (types, lint, formatting, package files) before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '24.x'
                  # the type-aware ESLint config and tsc need the widget package's dependencies
                  install-command: 'npm ci && cd src-widgets && npm ci'
                  type-checking: true
                  type-checking-command: 'cd src-widgets && npx tsc'
                  lint: true
                  lint-command: 'npm run lint && npm run format'
                  # test-command keeps its default: npm run test:package

    # Runs adapter tests on all supported node versions and OSes
    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x]
                # temp removed windows and mac because issues with python
                os: [ubuntu-latest]

        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            # - name: Install macos distutils
            # if: matrix.os == 'macos-latest'
            # run: python3 --version

            - name: Install Dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Run local tests
              run: npm test

            - name: Archive screenshots
              if: always()
              # if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: my-artifacts-${{ strategy.job-index }}
                  path: tmp/screenshots/**/*.png
                  retention-days: 3

    # Deploys the final package to NPM; the deploy action builds widgets/ itself (not tracked in git)
    deploy:
        needs: [check-and-lint, adapter-tests]

        # Trigger this step only when a commit on master is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/')

        runs-on: ubuntu-latest

        # Write permissions are required to create Github releases, id-token for npm trusted publishing
        permissions:
            contents: write
            id-token: write

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  # installs with the action's default `npm ci`; tasks.js installs src-widgets
                  build: true
                  github-token: ${{ secrets.GITHUB_TOKEN }}

    # Syncs documentation to GitHub Wiki independently (runs on main pushes and tags)
    sync-wiki:
        # Trigger this step on main branch pushes and tagged releases
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))

        uses: ./.github/workflows/sync-wiki.yml
